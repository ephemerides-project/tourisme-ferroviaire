# Tout le projet dans Docker : seul Docker Desktop est nécessaire.
#   docker compose up -d --build                                        -> base, API et interface
#   docker compose run --rm api python -m ingestion.pipeline --exemple  -> charge le jeu d'essai
#   docker compose up -d db                                             -> la base seule (API et interface lancées à la main)
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tourisme
      POSTGRES_PASSWORD: tourisme
      POSTGRES_DB: tourisme
    ports:
      - "5432:5432"
    volumes:
      - donnees_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tourisme -d tourisme"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API FastAPI sur http://localhost:8000 — le code est monté : une modification est prise en compte sans reconstruire.
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql://tourisme:tourisme@db:5432/tourisme
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-60}
      WATCHFILES_FORCE_POLLING: "true" # détection des modifications sous Windows et macOS
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/projet/backend
      - ./db:/projet/db
      - ./donnees:/projet/donnees
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Interface Next.js sur http://localhost:3000 — le premier démarrage installe les dépendances (1 à 3 minutes).
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - modules_web:/app/node_modules
    depends_on:
      - api

volumes:
  donnees_pg:
  modules_web:
